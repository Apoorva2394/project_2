name: Build and Push DEV Image

on:
  pull_request:
    branches:
      - dev

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Docker login
      run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin

    - name: Build image
      run:  docker build -t apoorva861/project_2:dev -f backend/Dockerfile backend

    - name: Push image
      run: docker push ${{ secrets.DOCKER_USERNAME }}/project2:dev
