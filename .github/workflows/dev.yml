name: Dev CI/CD Pipeline

on:
  push:
    branches:
      - dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: "${{ secrets.DOCKER_USERNAME }}"
          password: "${{ secrets.DOCKER_PASSWORD }}"

      # -------- Backend Image --------
      - name: Build & push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: apoorva861/project2:dev
          platforms: linux/amd64,linux/arm64

      # -------- Frontend Image --------
      - name: Build & push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: apoorva861/project2-frontend:dev
          platforms: linux/amd64,linux/arm64


      - name: Skip deploy (local cluster)
        run: echo "Skipping kubectl apply — local cluster not reachable from CI"

      - name: CI completed
        run: echo "Images built and pushed. Local Kubernetes deploy is manual."

