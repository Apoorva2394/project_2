apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend-dev
  template:
    metadata:
      labels:
        app: frontend-dev
    spec:
      containers:
        - name: frontend
          image: apoorva861/project2-frontend:dev
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
